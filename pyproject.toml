[project]
name = "qwen-2.1-uncensored-mlx-m5"
version = "0.1.0"
description = "Reproducible MLX implementation of Qwen Image 2.1 for Apple Silicon (M5, 16GB)"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "mlx==0.32.0",
    "torch>=2.7",
    "torchvision>=0.22",
    "transformers>=4.55",
    "diffusers>=0.35",
    "safetensors>=0.6",
    "huggingface_hub>=0.34",
    "Pillow>=11",
    "numpy>=2",
    "psutil>=7",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/qwen_mlx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
